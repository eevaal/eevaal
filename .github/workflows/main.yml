name: generate animation

on:
  # Запуск по расписанию (раз в сутки)
  schedule:
    - cron: "0 */24 * * *"
  
  # Кнопка для ручного запуска в Actions
  workflow_dispatch:
  
  # Запуск при пуше в ветку main
  push:
    branches:
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Вставляем оригинальный код плагина внутрь шагов сценария
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/ocean.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9&color_background=#aaaaaa

      # Шаг для сохранения файлов в репозиторий (чтобы их можно было вставить в README)
      - name: push github-snake to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
